<!DOCTYPE html>

<style>
:root{--gold:#ffd27a;--pink:#ff4fa8;--purple:#b36bff;--blue:#3aa0ff;--bg:#0b0406}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:Georgia,"Times New Roman",serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#probe{position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,2,4,.84);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:10;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.hidden{display:none!important}
.panel{width:min(94vw,420px);max-height:100%;overflow:auto;text-align:center;background:linear-gradient(180deg,#26110f,#0e0507);border:2px solid #b07a2a;border-radius:20px;padding:18px 16px;box-shadow:0 0 0 3px #3a1406,0 0 40px rgba(255,110,20,.15),0 20px 60px rgba(0,0,0,.8)}
.title{margin:6px 0 4px;font-weight:900;font-size:clamp(34px,11vw,52px);line-height:.95;letter-spacing:1px;background:linear-gradient(180deg,#fff7b0,#ffd000 45%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #6a1d00) drop-shadow(0 0 10px rgba(255,160,0,.45))}
.logo{display:block;width:100%;max-width:440px;margin:0 auto 2px;filter:drop-shadow(0 0 18px rgba(255,120,20,.25))}.logo.small{max-width:300px}
.tag{margin:6px 0 16px;color:#e8b89a;font-style:italic;font-size:15px}
.btn{display:block;width:100%;margin:10px 0 0;padding:13px 10px;font:900 18px Georgia,serif;letter-spacing:1px;color:#4a1400;background:linear-gradient(180deg,#fff0a8,#ffc21a 55%,#f08a00);border:2px solid #7a2a00;border-radius:40px;box-shadow:0 4px 0 #7a2a00;cursor:pointer}

.btn.big{font-size:26px;padding:16px}
.btn.alt{background:linear-gradient(180deg,#e8c7ff,#9b40ff 60%,#6a17c0);color:#fff;text-shadow:0 2px 0 #3a0870;border-color:#3a0870;box-shadow:0 4px 0 #3a0870}
.skrow{display:flex;justify-content:center;gap:4px}
.skrow img{width:27%;max-width:100px}
.best{margin-top:12px;color:var(--gold);font-size:14px}
.how{text-align:left;font-size:14px;line-height:1.35}
.how h3{margin:12px 0 4px;color:var(--gold);font-size:16px}
.how .r{display:flex;align-items:center;gap:8px;margin:5px 0}
.how img{width:38px;height:38px;flex:none}
h2{margin:4px 0 8px;font-size:30px;color:var(--gold);text-shadow:0 3px 0 #6a1d00}
.big-n{font-size:34px;font-weight:900;color:#fff;margin:4px 0}
.cands{display:flex;justify-content:center;gap:6px;margin:6px 0}
.cands img{width:48px;height:48px}
.cands img.off{opacity:.25}
.stat{color:#e8c4a8;margin:3px 0;font-size:15px}
#hudBtns{position:fixed;left:0;right:0;bottom:0;padding:0 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:5}
.rb{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);background:rgba(20,8,6,.85);color:var(--gold);font:900 20px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer}
#ver{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(2px + env(safe-area-inset-bottom));font:10px ui-monospace,Menlo,monospace;color:rgba(255,210,122,.45);z-index:6;pointer-events:none}
/* Loteria */
#lot{background:radial-gradient(circle at 50% 35%,#3a1210,#0a0406 75%);padding:8px;padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:calc(8px + env(safe-area-inset-bottom));--cw:80px}
.lwrap{width:100%;display:flex;justify-content:center}
#lPlay{display:flex;flex-direction:column;align-items:center}
#lot.land #lPlay{display:grid;grid-template-columns:auto auto;grid-template-areas:"head tabla" "top tabla" "msg tabla";column-gap:24px;align-items:center}
.lhead{grid-area:head;text-align:center;font-weight:900;font-size:clamp(24px,calc(var(--cw)*.36),54px);background:linear-gradient(180deg,#fff7b0,#ffd000 45%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #4a1000);margin-bottom:4px}
.ltop{grid-area:top;display:flex;gap:12px;align-items:center;margin-bottom:8px;width:calc(var(--cw)*4 + 36px)}
#lot.land .ltop{flex-direction:column;width:calc(var(--cw)*2.4)}
#lot.land .linfo{text-align:center;width:100%}
.lcard{position:relative;background:linear-gradient(180deg,#f3e6c8,#dcc79a);border:calc(var(--cw)*.03 + 1px) solid #8a1c1c;border-radius:calc(var(--cw)*.07);box-shadow:0 3px 10px rgba(0,0,0,.6),inset 0 0 calc(var(--cw)*.15) rgba(90,40,10,.4);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--cw)*.05) 2px calc(var(--cw)*.03);overflow:hidden;color:#3a1004;aspect-ratio:3/4;touch-action:manipulation;cursor:pointer}
.lcard img{width:92%;flex:1;min-height:0;object-fit:contain}
.lcard .nm{font-size:calc(var(--cw)*.1);font-weight:900;text-transform:uppercase;white-space:nowrap;letter-spacing:.2px;line-height:1.1}
.lcard .num{position:absolute;left:calc(var(--cw)*.05);top:1px;font-size:calc(var(--cw)*.12);font-weight:900;color:#8a1c1c}
.lcard .bean{position:absolute;left:50%;top:44%;width:46%;aspect-ratio:1.4/1;transform:translate(-50%,-50%) scale(0) rotate(-20deg);background:radial-gradient(ellipse at 35% 35%,#c98a5a,#6b3514 70%);border-radius:50%;box-shadow:0 2px 3px rgba(0,0,0,.5);transition:transform .18s cubic-bezier(.2,2,.4,1)}
.lcard.marked{background:linear-gradient(180deg,#ffe6a0,#e8b850);border-color:#c08000;box-shadow:0 0 calc(var(--cw)*.2) rgba(255,170,40,.7)}
.lcard.marked .bean{transform:translate(-50%,-50%) scale(1) rotate(-20deg)}
.lcard.missed{filter:grayscale(1) brightness(.6);opacity:.4}
.lcard.wrong{animation:shk .3s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#lCard{width:calc(var(--cw)*1.15);flex:none;cursor:default}
#lot.land #lCard{width:calc(var(--cw)*1.7)}
#lCard.flip{animation:flp .25s}
@keyframes flp{0%{transform:rotateY(90deg) scale(.8)}100%{transform:none}}
.linfo{flex:1;text-align:left;min-width:0}
#lName{font-size:clamp(18px,calc(var(--cw)*.26),42px);font-weight:900;color:#fff;text-shadow:0 2px 0 #4a1000;min-height:1.2em}
#lCount{color:#e8c4a8;font-size:clamp(12px,calc(var(--cw)*.14),20px);margin:2px 0 6px}
.tbar{height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;border:1px solid rgba(255,210,122,.5)}
#lTimer{height:100%;width:100%;background:linear-gradient(90deg,#ff5a00,#ffd000)}
#lCoins{margin-top:6px;color:var(--gold);font-weight:900;font-size:clamp(16px,calc(var(--cw)*.2),30px)}
#tabla{grid-area:tabla;display:grid;grid-template-columns:repeat(4,var(--cw));gap:6px;padding:7px;background:linear-gradient(180deg,#4a0e12,#240507);border:2px solid #b07a2a;border-radius:10px;box-shadow:0 0 30px rgba(0,0,0,.7)}
#lMsg{grid-area:msg;height:1.4em;margin-top:6px;text-align:center;font-size:clamp(20px,calc(var(--cw)*.3),44px);font-weight:900;color:var(--gold);text-shadow:0 2px 0 #4a1000}
#lRes .prize{font-size:clamp(34px,11vw,54px);font-weight:900;background:linear-gradient(180deg,#fff7b0,#ffd000 45%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #4a1000);margin:6px 0}
#ver{bottom:calc(64px + env(safe-area-inset-bottom))!important}
#tools{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6px + env(safe-area-inset-bottom));display:flex;gap:6px;z-index:5}
.tl{width:calc(min(60px,(100vw - 132px)/4));height:54px;border-radius:12px;border:2px solid #6a4418;background:linear-gradient(#2a120c,#110505);color:#e8c4a8;font:800 9px system-ui,sans-serif;letter-spacing:.3px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:2px;cursor:pointer}
.tl img{width:30px;height:30px;pointer-events:none}.tl b{pointer-events:none;margin-top:1px;white-space:nowrap}
.tl.on{border-color:#ffd27a;box-shadow:0 0 14px rgba(255,190,60,.65);color:#fff}
.tl.empty{opacity:.4}
.tl.spinnow{background:linear-gradient(#fff0a0,#f09010);color:#4a1400;animation:pulse 1s infinite}
.tl i{position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;border-radius:10px;background:#c0206a;border:1.5px solid #fff;color:#fff;font:900 11px system-ui,sans-serif;font-style:normal;line-height:16px;padding:0 4px}
html.mapOpen,html.mapOpen body{touch-action:pan-y}
#map{position:fixed;inset:0;z-index:9;background:#07030a}
#mapHead{position:absolute;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 10px 14px;display:flex;align-items:center;gap:10px;background:linear-gradient(#07030a,rgba(7,3,10,0));z-index:3;pointer-events:none}
#mapHead>*{pointer-events:auto}
#mapTitle{flex:1;text-align:center;font:900 22px Georgia,serif;color:var(--gold);text-shadow:0 2px 0 #4a1000}
#mapStars{display:flex;align-items:center;gap:3px;color:var(--gold);font:800 16px system-ui,sans-serif;min-width:42px;justify-content:flex-end}#mapStars img{width:22px;height:22px}
#mapScroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#mapInner{position:relative;margin:0 auto}
#mapC{display:block}
.node{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;border:3px solid #5a3a1a;background:radial-gradient(circle at 40% 35%,#3a2a2a,#120808);color:#8a7a6a;font:900 24px Georgia,serif;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px #000;padding:0}
.node img.nk{width:34px;height:34px;filter:grayscale(1) brightness(.5)}
.node.open{border-color:#ffd27a;color:#fff;background:radial-gradient(circle at 40% 35%,#ffb050,#8a2c00);box-shadow:0 0 22px rgba(255,160,40,.9);animation:pulse 1.4s infinite;text-shadow:0 2px 0 #4a1000}
.node.done{border-color:#e0a040;color:#ffd27a;background:radial-gradient(circle at 40% 35%,#6a3a14,#200a04)}
.node .st{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);display:flex;gap:0}
.node .st img{width:17px;height:17px}.node .st img.off{opacity:.2}
.node.final{width:86px;height:86px;margin:-43px 0 0 -43px}
.node.final img.fb{width:62px;height:62px}
.areaLbl{position:absolute;left:0;right:0;text-align:center;font:italic 700 15px Georgia,serif;color:#f0c8a0;text-shadow:0 2px 6px #000,0 0 12px #000;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.07)}}
.gl{display:flex;align-items:center;gap:10px;margin:6px 4px;font-size:16px;text-align:left;color:#fff}
.gl img{width:40px;height:40px;flex:none}
.gl.mv{justify-content:center;color:var(--gold);font-weight:700;margin-top:10px}
.newbox{margin:12px 0 4px;padding:10px 12px;border:1px dashed #b07a2a;border-radius:12px;color:#ffe0c0;font-size:14px;line-height:1.35;text-align:left;background:rgba(255,140,30,.06)}
.newbox b{color:#ffd27a}
#finC{display:block;margin:0 auto 6px;border-radius:12px;border:1px solid #6a4418}
</style>
</head>

</div>

<div id="pause" class="ov hidden">

<div id="win" class="ov hidden">

</div>

<div id="lose" class="ov hidden">

    <div class="skrow"><img id="lS1" alt=""></div>
    <img class="logo small" id="lLogo" alt="Skull-oh-Pa-loser">
    <div class="stat" id="lWhy"></div>
    <div class="big-n" id="lScore"></div>
    <div class="best" id="lBest"></div>
    <button class="btn big" id="bRetry" data-s="retry"></button>
    <button class="btn alt" id="bNew" data-s="newGame"></button>
  </div>
</div>

<div id="lot" class="ov hidden">
  <div class="lwrap">
    <div id="lPlay">
      <div class="lhead" data-s="lotHead"></div>

    <div id="lRes" class="panel hidden">
      <div class="stat" data-s="lotResult"></div>

      <div class="stat" id="rLines"></div>
      <div class="big-n" id="rTotal"></div>
      <button class="btn big" id="bCollect" data-s="collect"></button>
    </div>
  </div>
</div>

<div id="map" class="hidden">
  <div id="mapHead"><button class="rb" id="bMapBack" aria-label="Back">&#8249;</button><div id="mapTitle"></div><div id="mapStars"></div></div>
  <div id="mapScroll"><div id="mapInner"><canvas id="mapC"></canvas></div></div>
</div>
<div id="intro" class="ov hidden">

    <div class="stat" id="iArea"></div>

    <div id="iGoals"></div>
    <div class="newbox" id="iNew"></div>
    <button class="btn big" id="bStart" data-s="start"></button>
    <button class="btn alt" id="bIntroBack" data-s="back"></button>
  </div>
</div>
<div id="fin" class="ov hidden">
  <div class="panel">
    <canvas id="finC"></canvas>
    <h2 data-s="finT"></h2>
    <div class="stat" data-s="finSub"></div>
    <button class="btn big" id="bFinEndless" data-s="endless"></button>
    <button class="btn alt" id="bFinMap" data-s="map"></button>
  </div>
</div>

/* ---------------- match logic ---------------- */
function runFrom(r,c,dr,dc){
  const cells=[];let base=-1;
  while(inB(r,c)){const t=grid[r][c];if(!t||!matchable(t.t))break;if(t.t!==T.WILD){if(base<0)base=t.t;else if(t.t!==base)break}cells.push([r,c]);r+=dr;c+=dc}

}
function findRuns(){

  for(let c=0;c<COLS;c++){let end=-1;for(let r=0;r<ROWS;r++){const cells=runFrom(r,c,1,0);if(cells.length>=3&&cells.some(([a,b])=>grid[a][b].t!==T.WILD)){const e=r+cells.length-1;if(e>end){runs.push({cells,dir:'v'});end=e}}}}
  return runs;
}
function computeMatch(swap){
  const runs=findRuns();if(!runs.length)return null;
  const clear=new Set(),creates=[],taken=new Set(),used=new Set(),hMap=new Map(),vMap=new Map();
  runs.forEach((rn,i)=>rn.cells.forEach(([r,c])=>{clear.add(r*16+c);(rn.dir==='h'?hMap:vMap).set(r*16+c,i)}));
  const pick=cells=>{if(swap)for(const[sr,sc]of swap)if(cells.some(([r,c])=>r===sr&&c===sc)&&!taken.has(sr*16+sc))return[sr,sc];
    const k=Math.floor(cells.length/2);for(let i=0;i<cells.length;i++){const cc=cells[(k+i)%cells.length];if(!taken.has(cc[0]*16+cc[1]))return cc}return null};
  const add=(p,t)=>{if(!p)return;taken.add(p[0]*16+p[1]);creates.push({r:p[0],c:p[1],t})};
  runs.map((rn,i)=>[rn,i]).sort((a,b)=>b[0].cells.length-a[0].cells.length).forEach(([rn,i])=>{if(rn.cells.length>=5){used.add(i);add(pick(rn.cells),T.GHOST)}});
  for(const[k,hi]of hMap){if(vMap.has(k)){const vi=vMap.get(k);if(used.has(hi)||used.has(vi))continue;used.add(hi);used.add(vi);if(!taken.has(k))add([k>>4,k&15],T.MARACAS)}}
  runs.forEach((rn,i)=>{if(used.has(i)||rn.cells.length!==4)return;used.add(i);add(pick(rn.cells),rn.dir==='h'?T.TRUMPET:T.GUITAR)});
  return{clear,creates};
}
function swapRaw(r1,c1,r2,c2){const a=grid[r1][c1];grid[r1][c1]=grid[r2][c2];grid[r2][c2]=a}
function findMove(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)for(const[dr,dc]of[[0,1],[1,0]]){
    const r2=r+dr,c2=c+dc;if(!inB(r2,c2))continue;const a=grid[r][c],b=grid[r2][c2];if(!a||!b)continue;if(a.t===T.BONE||b.t===T.BONE||a.web||b.web)continue;
    if(special(a.t)||special(b.t))return[[r,c],[r2,c2]];
    swapRaw(r,c,r2,c2);const ok=findRuns().length>0;swapRaw(r,c,r2,c2);if(ok)return[[r,c],[r2,c2]];
  }
  return null;
}
function mostCommon(){const n=[0,0,0,0,0,0];for(const row of grid)for(const t of row)if(t&&t.t<6)n[t.t]++;let b=0;for(let i=1;i<6;i++)if(n[i]>n[b])b=i;return b}

function specialArea(t,r,c){

    do{t=randReg()}while((c>=2&&row[c-1].t===t&&row[c-2].t===t)||(r>=2&&grid[r-1][c].t===t&&grid[r-2][c].t===t));

async function collapse(){
  const fresh=[];
  for(let c=0;c<COLS;c++){
    let w=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){if(grid[r][c]){if(w!==r){grid[w][c]=grid[r][c];grid[r][c]=null}w--}}
    const m=w+1;for(let r=w;r>=0;r--){const t=newTile(refillType(),r,c,r-m-.2);grid[r][c]=t;fresh.push(t)}
  }
  if(soulsLeft>0&&fresh.length&&cellsOfType(T.SOUL).length<2&&rnd()<.55){fresh[rnd()*fresh.length|0].t=T.SOUL;soulsLeft--}
  await settle();

async function cascadeLoop(swap){
  let cascade=0;
  for(let guard=0;guard<60;guard++){
    const res=computeMatch(cascade===0?swap:null);
    if(!res){
      const bottom=[];for(let c=0;c<COLS;c++){const t=grid[ROWS-1][c];if(t&&(isGem(t.t)||t.t===T.SOUL))bottom.push(c)}
      if(!bottom.length)break;

  }

  if(!findRuns().length){swapRaw(r1,c1,r2,c2);sfx('bad');shake(4);await settle();busy=false;return}

async function specialSwap(p1,p2){
  const a=grid[p2[0]][p2[1]],b=grid[p1[0]][p1[1]];
  const clear=new Set(),K=(r,c)=>{if(inB(r,c))clear.add(r*16+c)};

  if(sa&&sb){

    else if(ts[0]===T.MARACAS&&ts[1]===T.MARACAS){for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)K(r+i,c+j);fx.push({k:'ring',r,c,life:.55,max:.55,rad:3.5})}

    punch(.14);shake(14);flash=.35;flashCol='#fff3b0';

function endlessCfg(l){const c={mv:levelMoves(l),tools:ALLT,ch:{reel:3,ring:2,spin:1},goals:{score:levelTarget(l)}};

  if(cfg.dark){for(let r=cfg.dark[0];r<Math.min(ROWS,cfg.dark[1]);r++)for(let c=0;c<COLS;c++){dark[r][c]=1;darkA[r][c]=1}}
  const cells=[];for(let r=2;r<ROWS;r++)for(let c=0;c<COLS;c++)cells.push([r,c]);shuffle(cells);
  if(cfg.bones){for(let i=0;i<cfg.bones.n&&cells.length;i++){const[r,c]=cells.pop(),t=grid[r][c];t.t=T.BONE;t.hp=cfg.bones.hp||1}}

function ringBtnPos(d){const cs=L.cs;return{x:Math.max(cs*.42,Math.min(W-cs*.42,cellX(ringSel.c)+d*cs*1.95)),y:cellY(ringSel.r)}}
function ringBtnAt(x,y){if(tool!=='ring'||!ringSel)return 0;for(const d of[-1,1]){const p=ringBtnPos(d);if(Math.hypot(x-p.x,y-p.y)<L.cs*.5)return d}return 0}
function reelBtnPos(d){const cs=L.cs;return{x:cellX(reelCol),y:d<0?L.by-cs*.42:L.by+cs*ROWS+cs*.42}}
function reelBtnAt(x,y){if(tool!=='reel'||reelCol==null)return 0;for(const d of[-1,1]){const p=reelBtnPos(d);if(Math.hypot(x-p.x,y-p.y)<L.cs*.5)return d}return 0}

  const rb=ringBtnAt(x,y);if(rb){ringRotate(ringSel.r,ringSel.c,rb);return}
  const vb=reelBtnAt(x,y);if(vb){reelShift(reelCol,vb);return}

cv.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.hypot(dx,dy)<=L.cs*.33)return;const d=drag;drag=null;sel=null;const h=Math.abs(dx)>Math.abs(dy);
  if(tool==='swap')trySwap(d.r,d.c,d.r+(h?0:Math.sign(dy)),d.c+(h?Math.sign(dx):0));

});
cv.addEventListener('pointerup',()=>{
  if(!drag)return;const d=drag;drag=null;
  if(tool==='swap'){if(sel&&Math.abs(sel.r-d.r)+Math.abs(sel.c-d.c)===1){const s=sel;sel=null;trySwap(s.r,s.c,d.r,d.c)}else if(sel&&sel.r===d.r&&sel.c===d.c)sel=null;else sel={r:d.r,c:d.c}}
  else if(tool==='reel'){reelCol=d.c;sfx('swap')}
  else if(tool==='ring'){if(ringValid(d.r,d.c)){ringSel={r:d.r,c:d.c};sfx('swap')}else{sfx('bad');const t=grid[d.r][d.c];if(t)t.wig=1}}
  else if(tool==='spin')toggleHold(d.c);

/* ---------------- update ---------------- */
function update(dt){
  updateClouds(dt);updateSpins(dt);
  for(let r=0;r<darkA.length;r++)for(let c=0;c<darkA[r].length;c++){const tg=dark[r][c]||0;darkA[r][c]+=(tg-darkA[r][c])*Math.min(1,dt*4)}
  now+=dt;layout(dt);
  let moving=false;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=grid[r]&&grid[r][c];if(!t)continue;
    if(t.sl){const s=7.5*dt,dx=c-t.x,dy=r-t.y,d=Math.hypot(dx,dy);if(d<=s){t.x=c;t.y=r;t.sl=0}else{t.x+=dx/d*s;t.y+=dy/d*s}}
    else{
    if(t.x!==c){const d=c-t.x,s=9*dt;t.x=Math.abs(d)<=s?c:t.x+Math.sign(d)*s}
    if(t.y<r){t.vy=Math.min(26,t.vy+42*dt);t.y+=t.vy*dt;if(t.y>=r){t.y=r;if(t.vy>6)t.land=1;t.vy=0}}
    else if(t.y>r){const s=9*dt;t.y=t.y-r<=s?r:t.y-s}}
    if(t.x!==c||t.y!==r)moving=true;
    if(t.sc<1)t.sc=Math.min(1,t.sc+dt*4.5);
    t.land=Math.max(0,t.land-dt*6);t.wig=Math.max(0,t.wig-dt*2.2);
  }
  if(!moving&&settleWaiters.length){const w=settleWaiters;settleWaiters=[];w.forEach(f=>f())}
  for(let i=dying.length-1;i>=0;i--){dying[i].die+=dt;if(dying[i].die>.24)dying.splice(i,1)}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}
    if(p.k==='s'){p.vy+=520*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}else{p.x+=(p.vx+Math.sin(now*3+p.rot)*30)*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.life-=dt;t.y-=38*dt;if(t.life<=0)texts.splice(i,1)}
  for(let i=flyers.length-1;i>=0;i--){const f=flyers[i];f.p+=dt/f.dur;if(f.p>=1){flyers.splice(i,1);f.done()}}
  for(let i=fx.length-1;i>=0;i--){fx[i].life-=dt;if(fx[i].life<=0)fx.splice(i,1)}
  if(banner){banner.t+=dt;if(banner.t>banner.dur)banner=null}
  shakeA*=Math.pow(.004,dt);if(shakeA<.3)shakeA=0;punchA*=Math.pow(.01,dt);flash=Math.max(0,flash-dt*1.6);
  for(const k in pileBump)pileBump[k]=Math.max(0,pileBump[k]-dt*3);
  scoreShown+=(score-scoreShown)*Math.min(1,dt*8);if(Math.abs(score-scoreShown)<1)scoreShown=score;
  embers.forEach(p=>{p.y+=p.vy*dt;p.x+=Math.sin(now*1.3+p.ph)*10*dt;if(p.y<-10){p.y=H+10;p.x=rnd()*W}});
  fogs.forEach(f=>{f.x+=f.vx*dt;if(f.x<-f.r)f.x=W+f.r;if(f.x>W+f.r)f.x=-f.r});
  spooks.forEach(g=>{g.x+=g.vx*dt;if((g.vx>0&&g.x>W+g.s)||(g.vx<0&&g.x<-g.s)){g.x=g.vx>0?-g.s:W+g.s;g.y=H*.25+rnd()*H*.6}});
  flickNext-=dt;if(flickNext<=0){flick=.45;flickNext=9+rnd()*10}flick=Math.max(0,flick-dt*.9);
  for(const k in pileLvl){pileLvl[k]+=(pile[k]-pileLvl[k])*Math.min(1,dt*(pile[k]<pileLvl[k]?2.5:6));pileBoom[k]=Math.max(0,pileBoom[k]-dt*1.1);
    if(pile[k]===NEED-1&&mode==='play'&&rnd()<dt*12){const p=pilePos(k),y=pileSkY[k]||p.base;parts.push({k:'s',x:p.x+(rnd()-.5)*p.s*.5,y:y+(rnd()-.5)*p.s*.4,vx:(rnd()-.5)*60,vy:-60-rnd()*90,life:.6,max:.6,col:rnd()<.5?'#fff3b0':TCOL[k==='pink'?11:k==='purple'?12:13],sz:1.5+rnd()*2})}}
  if(mode==='play'&&!busy){idle+=dt;if(idle>6){if(!hint)hint=findMove();if(hint&&(idle%2.2)<dt*1.5){for(const[r,c]of hint){const t=grid[r][c];if(t)t.wig=1}}}}
}
